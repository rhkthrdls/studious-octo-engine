const specialReportSections=[{"heading": "출동 개요", "html": "<div class=\"report-subheading\">가. 초자연현상 명칭</div><div class=\"report-line\">    1) 한여름 밤 탈출기</div><div class=\"report-subheading\">  나. 탐사 인원, 구조 및 생환 인원</div><div class=\"report-line\">    1) 탐사 인원: 1명 (현무 1팀 김솔음 요원)</div><div class=\"report-line\">    2) 구조 요청 인원: 1명.</div><div class=\"report-line\">    3) 생환 인원: 1명 (현무 1팀 김솔음 요원)</div><div class=\"report-subheading\">  다. 출동 경위</div><div class=\"report-line\">    ○ 00년 00월 00일 오후 4시 30분 경, 현무 1팀으로 걸려 온 긴급 구호 요청 콜에 의하여 초자연현상 &#x27;한여름 밤 탈출기&#x27;를 파악하였고 소수 인원 진입이 권고되고 있는 매뉴얼과 재난으로 규정되지 않은 현상임을 반영하여 초자연 현상에 진입.</div><div class=\"report-subheading\">  라. 주요 내용</div><div class=\"report-line\">  ○ 초자연현상 시공간 변형</div><div class=\"report-line\">  ○ 변칙 현상에서의 이상 현상과 탈출법</div><div class=\"report-line\">  ○ 초자연 현상과 SCP 재단 괴담과의 연관성</div>"}, {"heading": "탈출 경위", "html": "<h4 class=\"report-scene\">#1</h4><div class=\"report-line\">초자연 현상 &#x27;한여름 밤 탈출기&#x27; 1인 진입.</div><div class=\"report-line\">하얀 벽이 감싸고 있는 공간의 중앙, 바닥과 천장을 잇는 원통형 유리 케이스가 깨져 파편이 1m가량 흩어져있다. 앞면이 붕괴한 유리 케이스에 담겨있던 액체가 새어 나와 광택 나는 검은색 바닥을 적신 상태다. 액체가 신발에 붙었는데 걸을 때마다 바닥에 끈적하게 붙었다 떨어졌다.</div><div class=\"report-line\">원통형 유리 케이스 안은 텅 비어 있다.</div><div class=\"report-spacer\"></div><h4 class=\"report-scene\">#2</h4><div class=\"report-line\">조명이 깜박이는 공간에 벽면 마다 2개의 문이 있다.</div><div class=\"report-line\">지참한 나침반으로 방향을 파악해 오른 쪽 문 앞에 서자 자동으로 문이 열렸다. 공간으로 들어서자 쇠 긁히는 소리가 들렸고 문이 닫혔다. 책상과 의자, 컴퓨터와 관련 전산용품, 사원증 하나. 세 걸음을 걸어 의자에 앉았다. 조명에 빛은 꺼지지 않고 있다.</div><div class=\"report-line\">컴퓨터 본체를 켜자 모니터에 글자가 나타났다.</div><div class=\"report-spacer\"></div><blockquote class=\"report-system\">Hello, World</blockquote><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><div class=\"report-line\">깜박, 깜박</div><div class=\"report-spacer\"></div><blockquote class=\"report-system\">비밀번호를 입력해 주세요.</blockquote><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><div class=\"report-line\">가로 90cm, 세로 60cm 책상에 놓인 네모난 사원증을 뒤집어 비밀번호를 확인하고, 입력한다.</div><div class=\"report-spacer\"></div><blockquote class=\"report-system\">44201-47532-44060-52404</blockquote><div class=\"report-spacer\"></div><blockquote class=\"report-system\">동시 사용자가 있습니다. 다시 입력해 주세요.</blockquote><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><blockquote class=\"report-system\">44201-47532-44060-52404</blockquote><div class=\"report-spacer\"></div><blockquote class=\"report-system\">동시 사용자가 있습니다. 다시 입력해 주세요.</blockquote><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><blockquote class=\"report-system\">44201-47532-44060-52404</blockquote><div class=\"report-spacer\"></div><blockquote class=\"report-system\">로딩 중…</blockquote><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><blockquote class=\"report-system\">환영합니다!</blockquote><div class=\"report-spacer\"></div><div class=\"report-spacer\"></div><div class=\"report-line\">콰과광! 쿵, 쿵, 쿵!</div><div class=\"report-line\">공간 전체 흔들리더니 아래로 꺼졌다.</div><div class=\"report-note\">(기재된 매뉴얼 상 3초여야 하나, 7초 가량 떨어졌음.)</div><div class=\"report-line\">굳게 닫혀있던 자동문이 열렸다.</div><div class=\"report-spacer\"></div><h4 class=\"report-scene\">#3</h4><div class=\"report-line\">길게 뻗어진 복도 벽면에는 피로 얼룩진 살점들이 붙어있다. 살점에서 흘러나온 핏자국이 웅덩이를 만들었고, 웅덩이에서부터 성인 여성 발자국이 일자로 이어졌다.</div><div class=\"report-line\">직선 방향으로 발자국을 밟지 않으며 1분간 걷자 왼쪽에 반파된 문이 보였다. 빛이 들어오지 않는 공간에서 사람의 숨 소리가 들렸다.</div><div class=\"report-line\">신체를 닿지 않고 구겨진 문을 넘자 양복 차림의 여성이 벽면에 기대 주저앉은 채로 땀을 닦고 있다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 이게 누구야. 얼마 만에 보는 얼굴인지 모르겠네.</div><div class=\"report-dialogue\">-본부: …백일몽에서 초자연 현상에 진입한 겁니까?</div><div class=\"report-dialogue\">-시민: (웃으며) 알려줘도 되나 모르겠네? 새어둠을 발견했거든.</div><div class=\"report-dialogue\">-본부: 재난관리국에서 관리하고 있는 초자연 현상이니 협조 바랍니다.</div><div class=\"report-dialogue\">-시민: 너무하네. 유리 감옥에 갇히면 곤란해.</div><div class=\"report-spacer\"></div><div class=\"report-line\">여성은 숨을 들이 내쉬고 재난에 진입한 정황을 설명했다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 우리 직원이 충북 새 연구소에서 일할 연구원을 구한다는 인터넷 공고를 발견했어. 공고 기한이 다 지났는데 내려가지도 않고, 홈페이지를 클릭해도 알 수 없는 주소라는 팝업이 떴지. 이건 재난관리국과 동일하려나?</div><div class=\"report-dialogue\">-본부: …맞습니다.</div><div class=\"report-dialogue\">-시민: 즉시 백일몽에서 연구를 거쳤고, 아무튼 C조부터 진입했는데 대체 인력이 죽었어.</div><div class=\"report-dialogue\">-본부: 시점이 언제입니까?</div><div class=\"report-dialogue\">-시민: 사흘 정도 전이야. 괴이와 관련된 어둠이란 걸 알아냈고 어둠을 탐사할 직원으로 내가 자원했지.</div><div class=\"report-dialogue\">-본부: 알아낸 게 있습니까?</div><div class=\"report-spacer\"></div><div class=\"report-line\">여성이 손가락을 들어 복도 벽면에 붙어있는 살점을 가리켰다. 살점엔 근육이 드러나 있었는데 움찔거리며 팽창했다 수축하길 반복했다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 저거 살아 있는 거야. 몰랐지?</div><div class=\"report-spacer\"></div><h4 class=\"report-scene\">#4</h4><div class=\"report-line\">발을 내디뎠던 복도는 30m가량 이어졌다. 직선으로 걷는 도중 왼편에만 3개의 방이 있었으며, 문은 모두 반파되었다. 복도 바닥엔 성별을 알 수 없는 피 묻은 발자국과 번진 핏덩이가 보였고, 천장엔 1m 간격으로 설치된 LED 조명이 정상적으로 작동했다. 피비린내는 나지 않았다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 연구소는 대부분 탐사가 끝났어. 나는 돌아가려던 찰나였지.</div><div class=\"report-dialogue\">-본부: 연구소 말씀입니까?</div><div class=\"report-dialogue\">-시민: 여긴 실험이 실패해도 제대로 실패한 연구소야. 어떤 걸 연구 했는지는 다녀보면 알겠지. 소개해 줄까?</div><div class=\"report-spacer\"></div><div class=\"report-line\">복도 끝에 다다르자 오른쪽 천장에 비상구 표지판이 보였다. 시민이 오른쪽에 달린 손잡이를 밀어 철제 문을 열었다. 30계단 내려가자 동일한 철제문이 보여서 문을 열었다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 연구소는 지하 1층과 1층이 다야. 네가 도착한 곳이 1층이고.</div><div class=\"report-dialogue\">-본부: 판단한 근거가 있습니까?</div><div class=\"report-dialogue\">-시민: 뭐? 이거 좀 불쾌한데. 내가 안내까지 해주고 있잖아. 그쪽이 어둠을 탐사하는 목적이라도 알아야겠어.</div><div class=\"report-dialogue\">-본부: 구조 요청을 한 시민이 있습니다. 위치를 알 수 없어서요.</div><div class=\"report-dialogue\">-시민: 구조 요청? (3초간 침묵) 따라와.</div><div class=\"report-spacer\"></div><div class=\"report-line\">지하 1층은 1층과 상이한 구조였다. 비상계단으로 들어오자 조명이 깜박였다. 바닥엔 피가 고여있어 걸을 때마다 찰팍거리는 소리와 함께 코 끝에 피비린내가 스쳤다. 2m가량 직선으로 걷자 왼쪽에 방이 있다.</div><div class=\"report-line\">1층과 달리 양쪽에 문이 달려있고, 벽면에 카드인식기가 있다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: (책상에 놓였던 사원증의 복사본을 흔들며) 이런 건 공무원들이 생각도 못 했겠지, 안 그래?</div><div class=\"report-dialogue\">-본부: 제가 하겠습니다.</div><div class=\"report-dialogue\">-시민: 됐어, 마음의 준비나 해둬.</div><div class=\"report-spacer\"></div><div class=\"report-line\">시민은 카드 인식기에 사원증을 갖다 댔고 &#x27;인증되었습니다.&#x27; 소리가 들리더니 문이 열렸다. 조명이 들어오지 않는 실내. CCTV가 표시되고 있는 모니터 2개 너머로 가로 3m, 세로 2.5m의 강화유리가 보인다.</div><div class=\"report-line\">강화유리로 분리된 공간 안엔 피부가 벗겨진 괴생명체가 있다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 자극해 봐야 좋을 게 없어. 빨리 손에 쥐고 있는 거 확인해.</div><div class=\"report-spacer\"></div><div class=\"report-line\">괴생명체는 팔이 발끝까지 늘어져 있다. 손에 쥐고 있는 건 휴대폰이었다.</div><div class=\"report-spacer\"></div><h4 class=\"report-scene\">#5</h4><div class=\"report-line\">지하 1층을 일직선으로 30m 걷다 보면 종착지는 뻥 뚫려있다. 파괴된 연구실 벽면 안엔 흙 표면이 드러나며 길이 생겨났다. 동그랗게 뚫린 땅은 가로, 세로 각각 2.5m 가량 측정된다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 동굴이야. 괴이가 지나다닐 법한 크기지? 저 안에 둥지를 만든 거 같더라고.</div><div class=\"report-dialogue\">-본부: 괴이가 굴 안에서 서식하고 있다는 말씀입니까?</div><div class=\"report-dialogue\">-시민: 응. 이전 탐사팀에서 고생 좀 했지. 잠깐, 굴 안에 들어가 보려고?</div><div class=\"report-dialogue\">-본부: 보고에 필요한 일입니다.</div><div class=\"report-dialogue\">-시민: (탄식을 내뱉으며) 기다려봐, 정비나 하게.</div><div class=\"report-spacer\"></div><div class=\"report-line\">복도는 말 소리를 제외하면 조용했다.</div><div class=\"report-line\">여자가 정장 주머니를 뒤적거렸다. 지나오는 동안 괴생명체는 출동 신고자(추정)를 제외하면 발견할 수 없었고, 괴생명체의 근육은 벽면과 바닥에 붙어 있었다. 복도에 붙은 근육은 14개 였고 미세하게 움직이고 있어 정확한 크기는 알 수 없다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 백일몽에 대해 궁금한 건 없어? (기웃거리며) 왜 그래. 악덕 기업에도 이런 직원 한 명 쯤은 있을 수 있지.</div><div class=\"report-dialogue\">-본부: 유리 감옥에서의 진술이 아니라면 말을 곧이곧대로 받아들일 근거가 없습니다.</div><div class=\"report-dialogue\">-시민: 어이구. 그러세요?</div><div class=\"report-spacer\"></div><div class=\"report-line\">여자가 구덩이 안으로 발걸음을 내디뎠다.</div><div class=\"report-line\">동굴은 조명이 없어 시야가 확보되는 데 10초가 소요되었다.</div><div class=\"report-line\">1분 정도 걸었을 때부터 피비린내가 맡아졌다. 1층, 지하 1층과는 비교할 수 없을 농도였다. 발걸음 소리를 죽였고, 조금의 빛도 만들지 않은 채 600보 걷자 출구가 보였다.</div><div class=\"report-line\">출구에서 빠져나오고 본 광경은 지하 3층 규모의 원형 동굴이었다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: (귓가에 속삭이며) 판옵티콘 형태야.</div><div class=\"report-spacer\"></div><div class=\"report-line\">각 층에는 인큐베이터가 겹치지 않게 놓여있고, 인큐베이터 안엔 연구실에서 봤던 괴이가 들어있다. 괴이들은 눈을 감은 형태였는데 움직이고 있지 않았다.</div><div class=\"report-line\">다만, 지하 3층 바닥에 서서 수백 개 놓인 인큐베이터를 올려다보고 있는 하나의 개체.</div><div class=\"report-line\">복도를 돌아다니던 괴생명체다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: (엄지로 뒤를 가리키는 제스쳐를 취한다.)</div><div class=\"report-spacer\"></div><div class=\"report-line\">괴생명체에 지능이 있다.</div><div class=\"report-spacer\"></div><h4 class=\"report-scene\">#6</h4><div class=\"report-line\">여자가 열린 문에 노크를 두 번 했다.</div><div class=\"report-line\">노크 소리에 괴생명체의 목이 180도 돌아갔다.</div><div class=\"report-line\">괴생명체는 눈, 코, 입을 가지고 있었는데 위치는 통상 인간들과 다름없었다. 다만 눈동자는 붉었고 코는 납작했으며 입은 꿰매져 있다. 얼굴 형은 빗살무늬 토기 형태를 띄고 있다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 탐사 보고서 보니까 얘가 자꾸 1층 복도를 어슬렁어슬렁 거리더라고. 언젠가 이럴 줄 알았지.</div><div class=\"report-spacer\"></div><div class=\"report-line\">시민과 눈 마주친 괴생명체가 자리에서 일어났다. 천장에 머리가 닿자 고개를 숙인 채로 한 걸음 내디뎠다. 여자가 복도를 향해 뒷걸음질 치자 괴생명체가 여자를 따라 걸었다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: (힐긋거리며) 머리 굴리지 말고 내가 하는 말만 기억해.</div><div class=\"report-dialogue\">-본부: 아무런 말씀도 하지 마십시오. 괴이를 자극하지 말고 소리를 줄,</div><div class=\"report-dialogue\">-시민: (말을 끊으며) 백일몽에서 알아낸 것들을 알려줄게.</div><div class=\"report-spacer\"></div><div class=\"report-line\">여자가 복도 끝을 향해 뒤로 걸었다.</div><div class=\"report-line\">시야가 확보되지 않아 벽면에 붙어있는 살점과 부딪혔지만 움직임을 멈추지 않았다. 괴생명체는 살점을 빤히 바라보다 팔을 들어 떼어냈다. 떼어낸 살점을 <del>(검열)</del></div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 재난이란 게 기본적으로 영 동떨어진 세계로 떨어진다는 거잖아? 여기도 다름 없어.</div><div class=\"report-dialogue\">-본부: …</div><div class=\"report-dialogue\">-시민: SCP 재단이라고 들어봤어? 관리국이랑 하는 일이 비슷한데.</div><div class=\"report-spacer\"></div><div class=\"report-line\">시민이 숨을 들이키며 총을 괴생명체에 조준했다. 검은색 권총은 입구가 은색으로 물들어 있고, 옆면에 백일몽 주식회사 로고가 삽입되어 있다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 그 기관에서 관리하는 괴이야. 공기 중으로 바이러스를 분사하는 괴물인데 돌아가면 SCP-610을 검색해 봐.</div><div class=\"report-dialogue\">-시민: …아직은 나만 알고 있긴 한데 운이 좋았지. 정보량이 많아지니까.</div><div class=\"report-spacer\"></div><div class=\"report-line\">괴생명체가 상체를 수그려 권총에 얼굴을 들이밀었다. 눈동자가 권총의 생김새를 보고 있다. 시민의 손이 경미하게 떨렸다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 인터넷 괴담이랑 차이가 있다면 신체 능력이 떨어지고 지능이 높아. 인간보다 3배는 뛰어난 활동성을 보여야 하는 데 그렇진 않더라고. 일단 객관적인 정보는 여기까지.</div><div class=\"report-spacer\"></div><div class=\"report-line\">시민이 괴생명체를 발견했던 방을 눈짓으로 가리켰다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 사원증에 적힌 숫자는 여기에서 쓸 수 있는 공간 좌표야. 연구소 사내 시스템을 파보니까 나오더라고. 그러니까 가서 좌표 입력만 하고 돌아와.</div><div class=\"report-spacer\"></div><div class=\"report-line\">모니터 화면에 좌표를 입력할 때 총성이 세 발 울렸고, 복도로 나왔을 땐 숨죽인 채 바닥에 쓰러진 괴생명체와 허리가 반쯤 패인 시민이 있었다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 전염성이 강해서, 까다로운 거지. 위험만 감수하면 해치울 수 있어.</div><div class=\"report-spacer\"></div><div class=\"report-line\">시민이 연속적으로 기침하자 붉은 선혈이 뿜어져 나왔다. 손등으로 입가에 묻은 피를 닦아내곤 몸에 구멍이 난 괴생명체를 질질 끌고 컴퓨터가 있는 방으로 향했다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: (웃으며) 오, 전염성 되게 강하네. 힘부터 세지는 구나. 좌표는 잘 입력했지?</div><div class=\"report-dialogue\">-본부: …예.</div><div class=\"report-dialogue\">-시민: 또 울려고 하네.</div><div class=\"report-spacer\"></div><div class=\"report-line\">괴생명체를 컴퓨터가 있던 방안에 집어넣고 문을 쾅 닫았다. 10초 후, 문을 열어보자 깨끗한 바닥만 남아있다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 방 안에서 10분 내로 안 나가면 강제로 문밖에 쫓겨나. 이미 죽었으니 그대로 땅에 썩겠지.</div><div class=\"report-dialogue\">-본부: 어디로 보내신 겁니까?</div><div class=\"report-dialogue\">-시민: 본래 있던 격리지역. 연구원들이 연구하겠답시고 데려온 모양이더라고.</div><div class=\"report-spacer\"></div><div class=\"report-line\">뚫린 허리를 붙잡고 절뚝거리던 여자가 복도 벽에 기대앉았다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 동굴에서 본 인큐베이터에 갇힌 괴이들 기억나?</div><div class=\"report-dialogue\">-본부: 예.</div><div class=\"report-dialogue\">-시민: 그게 다 인간이었어. 자세히 살펴보면 형태가 조금씩 다른데 진화 과정을, 후. 살펴보는 거 같더라. 관리국으로 돌아가면 개체들을 없애버려.</div><div class=\"report-dialogue\">-본부: …알겠습니다.</div><div class=\"report-dialogue\">-시민: 공기만 섞이지 않도록 조심하면 돼. 자, 알려줄 수 있는 건 다 알려줬어!</div><div class=\"report-spacer\"></div><div class=\"report-line\">여자가 무릎을 끌어안고 입매를 끌어올렸다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-시민: 이제 돌아가.</div><div class=\"report-spacer\"></div><h4 class=\"report-scene\">#7</h4><div class=\"report-line\">손가락이 한 뼘 길어진 여자는 이성이 남아있었다.</div><div class=\"report-line\">본부는 여자에게 원래 세계로 갈 수 없음을 고지했고, 여자는 스스로 격리실로 향했다.</div><div class=\"report-line\">카드 키로 연구실 문을 열고 투명한 창에 갇혀있는 괴생명체를 향해 다가갔다.</div><div class=\"report-spacer\"></div><div class=\"report-line\">벌컥-</div><div class=\"report-spacer\"></div><div class=\"report-line\">문을 열자마자 괴생명체가 문 사이에 손을 집어넣었다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-본부: 비키십시오.</div><div class=\"report-spacer\"></div><div class=\"report-line\">유리 손 포에서 총알이 튀어 나갔다. 명중한 총알 탓에 괴이가 휘청거리는 틈을 타 숨통을 끊었다.</div><div class=\"report-line\">본부와 시민은 착용하고 있던 겉옷을 벗어 괴이의 팔에 두른 다음, 팔을 끌고 컴퓨터가 있는 방으로 이동했다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-본부: 동일한 좌표로 이송하겠습니다.</div><div class=\"report-spacer\"></div><div class=\"report-line\">앞선 괴생명체를 이동시킨 좌표를 모니터에 입력한 다음 문을 닫았다.</div><div class=\"report-line\">10분이 지나고 문을 열자 방은 텅 비어 있었다.</div><div class=\"report-spacer\"></div><div class=\"report-dialogue\">-본부: 협조 감사합니다.</div><div class=\"report-spacer\"></div><div class=\"report-line\">시민은 어깨를 으쓱이곤 괴생명체가 갇혀있던 격리실로 발걸음을 옮겼다.</div><div class=\"report-line\">격리실 보안이 작동하는 걸 확인 후, 귀환하였다.</div>"}, {"heading": "주요 이상 현상 및 인명피해", "html": "<div class=\"report-subheading\">가. 주요 이상 현상</div><div class=\"report-line\">    1) 금번 재난은 괴생명체로 인한 변이가 쟁점이므로 괴생명체를 주요 기술한다.</div><div class=\"report-line\">    2) 공기로 바이러스를 발산하는 바이러스 형 괴이이며 혈액 접촉에 의해서도 감염이 일어난다.</div><div class=\"report-line\">    3) 괴생명체는 평균 2.3M로 측정되며, 신체 능력도 인간보다 2~3배 뛰어나다.</div><div class=\"report-line\">    4) (한 개체에 한하여) 인간 행위를 답습하려는 모습을 보여 활동성에 관한 측정은 내릴 수 없었다.</div><div class=\"report-line\">    5) 괴생명체에 감염되면 3분 내로 발진, 가려움과 같은 증상을 보인다.</div><div class=\"report-line\">    6) 괴생명체로부터 뜯어져 나온 살점은 감염성이 없다.</div><div class=\"report-line\">    7) 괴생명체는 화염 또는 열을 다루는 무기로 사살할 수 있다.</div><div class=\"report-line\">    8) 증언에 따르면 인터넷에서 다루는 괴담의 한 종류로 SCP-610 문서를 참고할 수 있다.</div><div class=\"report-note\">(다만, 실제와는 다른 부분이 있을 수 있기에 적합 판정은 보류한다.)</div><div class=\"report-subheading\">  나. 인명피해</div><div class=\"report-line\">    1) 출동 신고를 한 뒤, 감염된 시민</div><div class=\"report-line\">    2) 백일몽 주식회사 직원 A 씨</div><div class=\"report-line\">    3) 지하 동굴 인큐베이터에 갇혀있던 연구원 및 시민으로 추정되는 약 400 개체</div>"}, {"heading": "향후 조치 계획", "html": "<div class=\"report-line\">○ 기존 초자연 현상에 2명 이상 투입하면 발견되는 현상으로, 새로운 재난 규정 및 매뉴얼이 필요함.</div><div class=\"report-line\">  ○ 초자연 현상과 달리 실제 시간과 오차가 발생하므로 오차 시간 파악이 필요함.</div><div class=\"report-line\">  ○ 괴생명체를 조사하여 연구소에 남아있는 괴생명체 처리 필요.</div><div class=\"report-line\">  ○ 새로운 재난 발발을 방지하기 위해 금번 현상의 완전한 종료 요청.</div>"}];

 '지출결의서':[['지출 기본정보',[['지출일자','20XX. XX. XX'],['지급대상','김솔음']]],['지출 상세내역',[['금액 (원)','34,000원'],['지출 목적','야근 식대'],['지출 내용','20XX년 XX월 야근 식대 지출결의서를 올리니 확인 부탁드립니다']]],['증빙',[['증빙내역','파일 확인 요망']]]]

function approvalTable(d){
 const timeLabel=(value)=>value?'XX. XX '+value:'—';
 const historicalOffset=[...String(d.title||'')].reduce((sum,ch)=>sum+ch.charCodeAt(0),0)%8;
 const days={'초자연 현상 보고서(변칙용)':12,'재난 보고서':17,'출장계획서':8,'장비 반출 신청서':11,'지출결의서':14,'장비 추가 지급 품의서':19,'인력 지원 요청서':23}; const historicalTime=(base)=>{const [h,m]=base.split(':').map(Number);const n=h*60+m+historicalOffset*7;return 'XX. '+String(days[d.title]||10).padStart(2,'0')+' '+String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
 if(d.state==='회람'){
 const isRyu=d.author==='류재관';
 const persons=isRyu?[[d.author,'현무1팀_요원',historicalTime('09:18'),'기안'],['최요원','현무1팀_요원',historicalTime('12:36'),'2차 결재'],['홍림','현무1팀_팀장',historicalTime('16:04'),'최종 결재']]:[[d.author,'현무1팀_요원',historicalTime('09:18'),'기안'],['홍림','현무1팀_팀장',historicalTime('16:04'),'최종 결재']];
 return `<section class="card approval-panel"><h3>결재선 및 처리 상태</h3><div class="approval-grid ${isRyu?'':'circulation-approval'}">${persons.map(([name,position,time,heading])=>`<div class="approval-cell"><div class="approval-heading">${heading}</div><div class="approval-person"><strong>${esc(name)}</strong><small>(${esc(position)})</small></div><div class="approval-date">${time}</div></div>`).join('')}</div></section>`;
 }
 if(!['완료','대기','결재 예정'].includes(d.state))return '';
 const done=d.state==='완료';
 if(d.state==='결재 예정'){
 const manpower=d.title==='인력 지원 요청서';
 const persons=manpower?[['최■■','현무1팀_요원',historicalTime('09:18')],['고명','현무3팀_요원','—'],['해금','현무3팀_팀장','—']]:[['류재관','현무1팀_요원',historicalTime('09:18')],['최요원','현무1팀_요원','—'],['최요원','현무1팀_요원','—']];
 return `<section class="card approval-panel"><h3>결재선 및 처리 상태</h3><div class="approval-grid">${persons.map(([name,role,time],i)=>`<div class="approval-cell"><div class="approval-heading">${(manpower?['기안','참조','최종 결재']:['기안','2차 결재','최종 결재'])[i]}</div><div class="approval-person"><strong>${esc(name)}</strong><small>(${esc(role)})</small></div><div class="approval-date">${time}</div></div>`).join('')}</div></section>`;
 }
 if(d.wasUpcoming){const manpower=d.title==='인력 지원 요청서';const persons=manpower?[['최■■','현무1팀_요원',historicalTime('09:18')],['고명','현무3팀_요원','—'],['해금','현무3팀_팀장',historicalTime('16:04')]]:[['류재관','현무1팀_요원',historicalTime('09:18')],['최요원','현무1팀_요원',historicalTime('12:36')],['최요원','현무1팀_요원',historicalTime('16:04')]];return `<section class="card approval-panel"><h3>결재선 및 처리 상태</h3><div class="approval-grid">${persons.map(([name,role,time],i)=>`<div class="approval-cell"><div class="approval-heading">${(manpower?['기안','참조','최종 결재']:['기안','2차 결재','최종 결재'])[i]}</div><div class="approval-person"><strong>${esc(name)}</strong><small>(${esc(role)})</small></div><div class="approval-date">${time}</div></div>`).join('')}</div></section>`;}
 if(d.autoSubmitted){const second=timeLabel(d.secondApprovalTime);const final=timeLabel(d.finalApprovalTime);const persons=[['김솔음','현무1팀_요원',d.submittedTime?'XX. XX '+d.submittedTime:historicalTime('09:18')],['류재관','현무1팀_요원',second],[d.approver||'최요원',(d.approver||'최요원')==='홍림'?'현무1팀_팀장':'현무1팀_요원',final]];return `<section class="card approval-panel"><h3>결재선 및 처리 상태</h3><div class="approval-grid">${persons.map(([name,role,time],i)=>`<div class="approval-cell"><div class="approval-heading">${['기안','2차 결재','최종 결재'][i]}</div><div class="approval-person"><strong>${esc(name)}</strong><small>(${esc(role)})</small></div><div class="approval-date">${time}</div></div>`).join('')}</div></section>`;}
 if(d.specialReport){const persons=[['김솔음','현무1팀_요원',historicalTime('09:18')],['류재관','현무1팀_요원',d.secondApproved?timeLabel(d.secondApprovalTime):'—'],['최요원','현무1팀_요원','—']];return `<section class="card approval-panel"><h3>결재선 및 처리 상태</h3><div class="approval-grid">${persons.map(([name,role,time],i)=>`<div class="approval-cell"><div class="approval-heading">${['기안','2차 결재','최종 결재'][i]}</div><div class="approval-person"><strong>${esc(name)}</strong><small>(${esc(role)})</small></div><div class="approval-date">${time}</div></div>`).join('')}</div></section>`;}
 const finalApprover=d.approver||'최요원';
 const persons=[['김솔음','현무1팀_요원',historicalTime('09:18')],['류재관','현무1팀_요원',historicalTime('12:36')],[finalApprover,finalApprover==='홍림'?'현무1팀_팀장':'현무1팀_요원',historicalTime('16:04')]];
 return `<section class="card approval-panel"><h3>결재선 및 처리 상태</h3><div class="approval-grid">${persons.map(([name,role,time],i)=>`<div class="approval-cell"><div class="approval-heading">${['기안','2차 결재','최종 결재'][i]}</div><div class="approval-person"><strong>${esc(name)}</strong><small>(${esc(role)})</small></div><div class="approval-date">${done||i===0?(done?time:(d.submittedTime?'XX. XX '+d.submittedTime:historicalTime('09:18'))):'—'}</div></div>`).join('')}</div></section>`
}
function docs(){if(state.doc){const d=state.doc;return `<button class="back" data-backdoc="1">〈 목록으로</button>${header('문서 상세조회',d.state)}<div class="card"><h3>${esc(d.title)}</h3><div class="idrow"><span class="muted">작성자</span>${esc(d.author)}</div><div class="idrow"><span class="muted">작성일</span>${esc(d.date)}</div><div class="idrow"><span class="muted">상태</span>${esc(d.state)}</div></div>${approvalTable(d)}${structuredDoc(d)}`}const filtered=currentDocs().filter(d=>d.title.includes(state.search)||d.author.includes(state.search));return header('결재함')+`<div class="tabs">${['개인결재함','회람함','결재예정문서'].map(f=>`<button class="${state.folder===f?'active':''}" data-folder="${f}">${f}</button>`).join('')}</div>${state.folder==='개인결재함'?`<div class="status">${['대기','보류','완료'].map(s=>`<button class="${state.status===s?'active':''}" data-status="${s}">${s}${s!=='완료'?`<b>${s==='대기'?1+state.sent.length:0}</b>`:''}</button>`).join('')}</div>`:''}<input class="search" id="search" placeholder="문서 제목 또는 작성자 검색" value="${esc(state.search)}"><div class="small muted" style="margin-bottom:14px">${state.folder==='개인결재함'?state.status+' 문서':state.folder}</div>${filtered.length?filtered.map(d=>`<button class="listitem" data-doc="${currentDocs().indexOf(d)}"><div><strong>${esc(d.title)}</strong><small>${esc(d.author)} · ${esc(d.date)}</small></div><span class="arrow">›</span></button>`).join(''):'<div class="card muted">문서가 없습니다.</div>'}`}
function fieldDefault(type){return type==='department'?'현무 1팀':type==='position'?'요원':type==='grade'?'멸형':''}
function field(f){const [label,type]=f,k=state.form+'|'+label,val=state.values[k]??fieldDefault(type);let input;if(type==='long')input=`<textarea data-field="${esc(label)}" placeholder="${esc(label)} 입력">${esc(val)}</textarea>`;else if(['department','position','grade'].includes(type)){const options=type==='department'?departments:type==='position'?['주무관','요원','팀장']:['멸형','파형','뇌형','고형'];input=`<select data-field="${esc(label)}">${options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else input=`<input data-field="${esc(label)}" type="${type}" value="${esc(val)}" placeholder="${esc(label)} 입력">`;return `<div class="field"><label>${esc(label)}</label>${input}</div>`}
function write(){if(!state.form)return header('전자결재','문서 11종')+'<p class="muted small">작성할 문서 양식을 선택하세요.</p>'+'<div class="joined-list">'+templates.map((t,i)=>`<button class="joined-item" data-form="${i}"><svg viewBox="0 0 24 24">${[icons.write,icons.docs,icons.org,icons.docs,icons.write,icons.docs,icons.write,icons.home,icons.docs,icons.org,icons.write][i]}</svg><span>${t.name}${state.drafts[t.name]?'<small>임시저장됨</small>':''}</span><span class="chevron">›</span></button>`).join('')+'</div>';const t=templates.find(t=>t.name===state.form);return `<button class="back" data-backform="1">〈 목록</button>${header(state.form,'기안 작성')}<p class="muted small">기안자　김솔음 · 현무 1팀</p>${t.sections.map(([title,fields])=>`<section class="card"><h3>${title}</h3>${fields.map(field).join('')}</section>`).join('')}<section class="card"><h3>결재선</h3><p class="small">김솔음 → 류재관 → ${esc(state.approver)}</p><select id="approver">${['최요원','홍림'].map(x=>`<option ${x===state.approver?'selected':''}>${x}</option>`).join('')}</select><p class="note">결재선은 시안용 예시입니다.</p></section>${['장비 반출 신청서','위험구역 출입 허가 신청서','출장계획서','장비 추가 지급 품의서','인력 지원 요청서'].includes(state.form)?'':'<section class="card"><h3>첨부파일</h3><input type="file" id="attachment" multiple><p class="note">파일은 이 기기에서만 선택되며 서버로 전송되지 않습니다.</p></section>'}<div class="btnrow"><button class="btn secondary" data-save="1">임시저장</button><button class="btn" data-submit="1" ${state.approver==='홍림'?'disabled style="background:#aeb5bf;color:#f7f7f7;cursor:not-allowed;opacity:.75"':''}>결재 상신</button></div>${state.notice?`<div class="toast">${esc(state.notice)}</div>`:''}`}
let reportViewTimer=null;
function cancelReportViewTimer(){if(reportViewTimer!==null){clearTimeout(reportViewTimer);reportViewTimer=null}}
function nowApprovalTime(addMinutes=0){const d=new Date(Date.now()+addMinutes*60000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function startReportViewTimer(doc){cancelReportViewTimer();if(!doc)return;
if(doc.specialReport){if(doc.secondApproved)return;reportViewTimer=setTimeout(()=>{reportViewTimer=null;if(state.doc!==doc||state.tab!=='docs')return;doc.secondApproved=true;doc.secondApprovalTime=nowApprovalTime();render();showReportApprovalToast()},3000);return;}
if(!doc.autoSubmitted||doc.secondApproved)return;
const fast=['초자연 현상 보고서','재난 보고서'].includes(doc.title);
reportViewTimer=setTimeout(()=>{reportViewTimer=null;if(state.doc!==doc||state.tab!=='docs')return;doc.secondApproved=true;doc.secondApprovalTime=nowApprovalTime();if(fast){doc.finalApproved=true;doc.finalApprovalTime=nowApprovalTime();}render();showReportApprovalToast(fast?'모든 결재가 완료되었습니다.':'결재되었습니다.');},fast?3000:7000);
}
function showReportApprovalToast(message){const t=document.getElementById('report-approval-toast');if(!t)return;if(message)t.textContent=message;t.classList.add('visible');setTimeout(()=>t.classList.remove('visible'),2000)}
function showReferenceToast(){const t=document.getElementById('reference-toast');if(!t)return;t.classList.add('visible');setTimeout(()=>t.classList.remove('visible'),2000)}
function render(){app.innerHTML='<main class="screen">'+({home,org:orgview,docs,write}[state.tab]())+'</main>'+nav()+'<div id="reference-toast" class="reference-toast" role="status">참조는 결재하실 수 없습니다.</div><div id="report-approval-toast" class="reference-toast" role="status">결재 되었습니다.</div>'+(state.approverWarning?'<div class="approver-warning-backdrop"><div class="approver-warning-box"><p>다시 선택해주세요.</p><button type="button" data-close-warning="1">확인</button></div></div>':'')}
app.addEventListener('click',e=>{const el=e.target.closest('[data-close-warning],[data-go],[data-togglemenu],[data-flip],[data-team],[data-unit],[data-folder],[data-status],[data-doc],[data-backdoc],[data-form],[data-backform],[data-more],[data-backmore],[data-save],[data-submit]');if(!el)return;const d=el.dataset;if(d.closeWarning){state.approverWarning=false;render();return;}if(d.go){cancelReportViewTimer();state.tab=d.go;if(d.openCirculated){state.folder='회람함';state.search=''}state.doc=null;state.more=null;state.menuOpen=false;state.notice=''}else if(d.togglemenu){state.menuOpen=!state.menuOpen}else if(d.flip){state.flip=!state.flip}else if(d.team){state.team=state.team===d.team?null:d.team;state.unit=null}else if(d.unit){state.unit=state.unit===d.unit?null:d.unit}else if(d.folder){cancelReportViewTimer();state.folder=d.folder;state.doc=null;state.search=''}else if(d.status){cancelReportViewTimer();state.status=d.status;state.doc=null;state.search=''}else if(d.doc!==undefined){state.doc=currentDocs()[Number(d.doc)];startReportViewTimer(state.doc);if(state.doc&&state.doc.state==='결재 예정')setTimeout(showReferenceToast,30)}else if(d.backdoc){cancelReportViewTimer();if(state.doc&&state.doc.autoSubmitted&&state.doc.finalApproved&&state.doc.state==='대기'){state.doc.state='완료';state.sent=state.sent.filter(x=>x!==state.doc);complete.unshift(state.doc);state.status='완료'}if(state.doc&&state.doc.state==='결재 예정'){const idx=upcoming.indexOf(state.doc);if(idx>=0){const moved=upcoming.splice(idx,1)[0];moved.state='완료';moved.wasUpcoming=true;complete.push(moved);state.folder='개인결재함';state.status='완료';state.search=''}}state.doc=null}else if(d.form!==undefined){state.form=templates[Number(d.form)].name;state.notice=''}else if(d.backform){state.form=null;state.notice=''}else if(d.more){state.more=d.more;state.tab='more';state.menuOpen=false}else if(d.backmore){state.more=null}else if(d.save){state.drafts[state.form]=true;state.notice='현재 화면에 임시저장되었습니다.'}else if(d.submit){if(state.approver==='홍림'){state.approverWarning=true;render();return;}const t=templates.find(x=>x.name===state.form),body=t.sections.flatMap(s=>s[1].map(([name,type])=>name+': '+((state.values[state.form+'|'+name]??fieldDefault(type))||'미입력'))).join('\n');const submittedFields=Object.fromEntries(t.sections.flatMap(section=>section[1].map(([label,type])=>[label,state.values[state.form+'|'+label]??fieldDefault(type)])));
const clock=new Date();const submittedTime=String(clock.getHours()).padStart(2,'0')+':'+String(clock.getMinutes()).padStart(2,'0');
state.sent.unshift({title:state.form,author:'김솔음',date:'20XX. XX. XX',state:'대기',body,submittedFields,approver:state.approver,submittedTime,autoSubmitted:true,secondApproved:false,finalApproved:false});state.notice='결재함 대기 목록에 추가되었습니다.'}render()});
app.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)}else if(e.target.dataset.field){state.values[state.form+'|'+e.target.dataset.field]=e.target.value}});
app.addEventListener('change',e=>{if(e.target.id==='approver'){state.approver=e.target.value;if(state.approver==='홍림')state.approverWarning=true;else state.approverWarning=false;render()}else if(e.target.dataset.field){state.values[state.form+'|'+e.target.dataset.field]=e.target.value}});
render();
</script></body></html>
